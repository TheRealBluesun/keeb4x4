[package]
name = "keeb-v2-boot"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32g431cb", "time-driver-tim4"] }
embassy-time = "0.5.1"
embassy-usb = { version = "0.6.0", default-features = false }
embassy-futures = "0.1.2"
static_cell = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
