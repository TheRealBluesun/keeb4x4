[package]
name = "keeb-host"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "keeb"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
ctrlc = "3"
nusb = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.9", default-features = false }
sha2 = "0.10"

[profile.release]
lto = true
strip = true
